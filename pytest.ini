[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=agent --cov=cli --cov=skills --cov-report=term-missing --cov-report=html

[coverage:run]
branch = True
source = agent, cli, skills
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */conftest.py
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
show_missing = True
fail_under = 80
skip_empty = True

[coverage:html]
directory = htmlcov
title = Solana Meme Agent Coverage Report
