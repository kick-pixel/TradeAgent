[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-meme-trading-agent"
version = "0.1.0"
description = "Solana Meme Coin AI Trading Agent with Bitget Wallet Integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "BestTradeAgent Team"}
]
keywords = ["solana", "meme", "trading", "agent", "ai", "bitget-wallet"]

dependencies = [
    # Core Agent Framework
    "agent-skills-sdk>=0.1.1",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    
    # Solana Integration
    "solana>=0.35.0",
    "solders>=0.23.0",
    
    # HTTP & Async
    "aiohttp>=3.9.0",
    "requests>=2.32.0",
    
    # Security & Crypto
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "bip-utils>=2.9.0",
    "keyring>=25.0.0",
    
    # Data Processing
    "pydantic>=2.0.0",
    
    # CLI
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
meme-agent = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "cli*", "skills*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
